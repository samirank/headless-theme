name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches theme version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^Version: *//p' style.css | tr -d '\r')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match style.css Version ${version}" >&2
            exit 1
          fi

      - name: Build zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/headless-theme
          git ls-files -z | grep -zvE '^(\.github/|\.agents/|\.cursor/|\.gitignore|\.env\.example|AGENTS\.md|CLAUDE\.md|CONTRIBUTING\.md|SECURITY\.md|SUPPORT\.md|docs/|engineering-standards\.yml)' | xargs -0 cp --parents -t dist/headless-theme
          (cd dist && zip -qr headless-theme.zip headless-theme && sha256sum headless-theme.zip > headless-theme.zip.sha256)

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/headless-theme.zip dist/headless-theme.zip.sha256 --title "${GITHUB_REF_NAME}" --generate-notes
